project_id = "my-financial-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches outgoing magic links locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Single-user system: the only user is provisioned with `pnpm db:owner`.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enabled = true
# Enables the e-mail provider (magic links). Actual signups stay blocked by
# [auth] enable_signup = false plus the allowlist trigger in the database.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
otp_expiry = 3600
max_frequency = "20s"
