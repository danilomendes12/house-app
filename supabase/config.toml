# The Supabase CLI is a *tool* here, not a stack: it owns the migrations (`db push`) and
# generates the database types, both against the Postgres in deploy/docker-compose.yml.
# `supabase start` is not used — running a second Postgres, GoTrue and PostgREST alongside
# the ones in compose is what made this project feel like two projects.
#
# So there is almost nothing to configure. Auth is configured where it actually runs, in
# the GoTrue environment of deploy/docker-compose.yml; anything added back here would be a
# second source of truth that nothing reads.

project_id = "my-financial-app"

[db]
major_version = 17
