# The stack: Postgres + GoTrue + PostgREST behind Caddy. This is Supabase, self-hosted —
# the same pieces the hosted product runs, minus everything the app does not use.
#
# Driven by `pnpm dev` (scripts/stack.mjs), which also generates the secrets, pushes the
# migrations and provisions the owner. Running it by hand is possible once those are done:
#
#   docker compose up -d --wait          # db + auth + rest + caddy
#   docker compose --profile studio up -d   # plus the database UI
#   docker compose --profile web up -d      # plus the app's own container
#
# On the server this file is layered with docker-compose.server.yml, which is the whole
# difference between the two installations: 80/443 published, DOMAIN required, and `web`
# always on. Everything else — images, wiring, secrets — is deliberately identical.
#
# Every `${VAR:?}` is deliberate: nothing here has a default, so the stack refuses to start
# with a missing secret instead of silently falling back to the Supabase CLI's public demo
# keys.
#
# Not here on purpose: Kong (the API is not public — Caddy routes it), Realtime, Storage,
# imgproxy, Logflare and Supavisor (the app uses none of them).

name: financas

services:
  # Gives the API a single origin. `supabase-js` is built around one base URL with
  # /auth/v1/* and /rest/v1/* under it, and those are two different containers — this is
  # what joins them, and it is what replaces Kong. See Caddyfile.
  #
  # On :8000 it is loopback only — unreachable from another machine, published at all only
  # because the Next dev server runs on the host and not in this network. The public side
  # (80/443, the app, the certificate) is added by docker-compose.server.yml and exists
  # nowhere else: :8000 is the Supabase API and stays private on both installations.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SUPABASE_API_PORT:-8000}:8000'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # supabase/postgres, not plain postgres: the migrations need the `auth` schema, auth.uid()
  # and the anon / authenticated / service_role / authenticator roles, and this image
  # creates all of them on first boot. What it does *not* do is give them a password — that
  # is init/zz-role-passwords.sql, and without it GoTrue cannot connect.
  db:
    image: supabase/postgres:17.6.1.156
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Mounted file by file: the entrypoint ignores subdirectories of initdb.d.
      - ./init/zz-role-passwords.sql:/docker-entrypoint-initdb.d/zz-role-passwords.sql:ro
    # Loopback only. Published so `supabase db push` and `gen types` reach it from the host.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', '127.0.0.1', '-p', '5432']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # GoTrue — this *is* Supabase Auth. It owns the `auth` schema and runs its own migrations
  # at boot, which is why it has to be healthy *before* `supabase db push`: our first
  # migration puts a trigger on auth.users, a table that does not exist until this service
  # has started once.
  auth:
    image: supabase/gotrue:v2.194.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      # Internal address; there are no e-mail links to build.
      API_EXTERNAL_URL: http://caddy:8000/auth/v1
      GOTRUE_SITE_URL: http://localhost:${WEB_PORT:-3000}/financial
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      # Must be the very secret that signed the two SUPABASE_*_KEY values. If these three
      # ever drift apart the only symptom is a bare 401.
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: http://caddy:8000/auth/v1
      # Closed household (SPEC §5.4): the two users come from pnpm db:owner / db:invite,
      # and public.allowed_emails rejects anyone else at the database level.
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: 'false'
      # The e-mail provider is what makes grant_type=password work. There is no SMTP host
      # configured anywhere, and autoconfirm is what keeps that from mattering: no mail is
      # ever sent, and no user waits for a confirmation that would never arrive.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      # There is no recovery flow (SPEC §12), so the password is the whole door.
      GOTRUE_PASSWORD_MIN_LENGTH: '12'
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PostgREST — this *is* the Supabase REST API, the one supabase-js talks to and where RLS
  # is enforced. It connects as `authenticator`, which owns nothing and can only become the
  # role named in the JWT — never as a superuser.
  rest:
    image: postgrest/postgrest:v14.15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_ADMIN_SERVER_PORT: '3001'
    healthcheck:
      # The image has no wget or curl, so the admin server is spoken to with bash's
      # /dev/tcp. /ready is 200 only once the schema cache is loaded.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/3001 && printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The app itself. Behind a profile because *here* the everyday flow runs Next on the host
  # with hot reload (`pnpm dev`) against these same services, and this is only the smoke
  # test of the thing that ships — `pnpm stack prod`. On the server the profile is always
  # on: there it is the app, built from the checked-out commit and waited on like the rest.
  web:
    profiles: ['web']
    build:
      context: ..
      dockerfile: Dockerfile
    image: financas-web:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      # The container reaches the API by service name; the host reaches it on loopback.
      SUPABASE_URL: http://caddy:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      caddy:
        condition: service_started

  # The database UI, also under a profile — `pnpm stack studio`. Off by default because it
  # is a browsing tool, not part of the app: nothing depends on it being up.
  studio:
    profiles: ['studio']
    image: supabase/studio:2026.07.27-sha-cbb076d
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      - '127.0.0.1:${STUDIO_PORT:-54323}:3000'
    environment:
      # The image's own healthcheck fetches 127.0.0.1:3000; without this Next binds to the
      # container hostname instead and the container never turns healthy.
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DEFAULT_ORGANIZATION_NAME: Casa
      DEFAULT_PROJECT_NAME: financas
      SUPABASE_URL: http://caddy:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:${SUPABASE_API_PORT:-8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      AUTH_JWT_SECRET: ${JWT_SECRET:?}

  # Studio reads and writes the schema through this, not through PostgREST.
  meta:
    profiles: ['studio']
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: db
      PG_META_DB_PORT: '5432'
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?}

volumes:
  db-data:
  caddy-data:
  caddy-config:
