name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm format:check

  # The app image, built here and pulled by the VM (Fase 13). The VM has 1 GB of RAM and the
  # build needs ~1150 MiB of it (docs/HOSTING.md §1.1), so it stopped being a build machine.
  #
  # `needs: check` is the point of the design, not a formality: no red commit becomes an
  # image, and `pnpm server` deploys a tag — so a broken commit has nothing to deploy.
  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # x86 only: the VM is a netcup piko (x86). No multi-arch, no QEMU, no build that
          # takes four times as long for an architecture nothing runs.
          platforms: linux/amd64
          push: true
          # `sha-<short>` is what the deploy asks for by name — one tag, one commit, and a
          # rollback is `pnpm server --tag sha-<older>`. `latest` is for looking at by hand.
          tags: |
            ghcr.io/${{ github.repository }}/web:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
